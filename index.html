<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>양곡고 No AI 평가센터</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    label:has(#v3-student-birth) { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <main style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a">
      <div style="text-align:center;padding:28px">
        <h1 style="font-size:25px;margin:0 0 10px">양곡고 No AI 평가센터</h1>
        <p style="margin:0;color:#64748b">평가센터를 불러오는 중입니다.</p>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="fullscreen-lock" class="fullscreen-lock hidden">
    <div class="lock-card">
      <h2>시험 화면을 벗어났습니다</h2>
      <p>전체화면으로 돌아와야 답안을 계속 작성할 수 있습니다.</p>
      <button id="return-fullscreen" class="primary">전체화면으로 돌아가기</button>
    </div>
  </div>
  <div id="pdf-stage" class="pdf-stage" aria-hidden="true"></div>

  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./vendor/jszip.min.js"></script>
  <script src="./vendor/pdf.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>

  <script src="./github-local-api.js"></script>
  <script src="./account-api.js"></script>
  <script src="./student-auth-v2-api.js"></script>
  <script src="./account-migration.js"></script>
  <script src="./auth-flow-v2.js"></script>
  <script src="./mutation-observer-guard.js"></script>
  <script src="./admin-branding-v3.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
